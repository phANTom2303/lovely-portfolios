info:
  name: Create Skill
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/skills"
  body:
    type: json
    data: |-
      {
        "skill_name": "React"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
