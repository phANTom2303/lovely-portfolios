info:
  name: Create Asset
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/assets"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Resume PDF",
        "link": "https://example.com/resume.pdf",
        "description": "My latest resume",
        "asset_type": "document"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
