info:
  name: Update Asset
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/assets"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "asset_id": 1,
        "title": "Updated Resume",
        "link": "https://example.com/resume-v2.pdf"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
