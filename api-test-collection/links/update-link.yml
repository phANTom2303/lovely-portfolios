info:
  name: Update Link
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/links"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "link_id": 1,
        "title": "Updated GitHub",
        "link": "https://github.com/johndoe-updated",
        "description": "Updated description"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
