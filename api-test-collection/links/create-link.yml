info:
  name: Create Link
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/links"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "link": "https://github.com/johndoe",
        "title": "GitHub Profile",
        "description": "My GitHub page"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
