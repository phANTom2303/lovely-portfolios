info:
  name: Sign Up
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/signup"
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "email": "johnaaaaaa@example.com",
        "password": "Password123!",
        "phone_no": "9876543210"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
