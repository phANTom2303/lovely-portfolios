info:
  name: Update Education
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/education"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "edu_id": 1,
        "institute_name": "Updated University",
        "marks": 9.0,
        "total_mark": 10
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
