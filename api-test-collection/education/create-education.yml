info:
  name: Create Education
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/education"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "education_type": "under_graduate",
        "start_date": "2019-06-01",
        "end_date": "2023-05-31",
        "marks": 8.5,
        "marks_type": "gpa",
        "total_mark": 10,
        "institute_name": "State University",
        "stream": "Computer Science"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
