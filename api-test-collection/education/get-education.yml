info:
  name: Get Education
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/education"
  params:
    - name: edu_id
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
