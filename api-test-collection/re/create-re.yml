info:
  name: Create Resume Entity
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/re"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "re_type": "project",
        "title": "Portfolio Website",
        "description": "A personal portfolio site built with React",
        "skills": [ "hehe", "haha"],
        "from_date": "2024-01-01",
        "to_date": "2024-06-30"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
