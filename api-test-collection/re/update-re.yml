http:
  method: PATCH
  url: "{{baseUrl}}/api/re"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "re_id": 5,
        "title": "Updated Portfolio",
        "status": "active",
        "skills_id": [1, 2, 3],
        "links": ["sampleurl"]
      }
